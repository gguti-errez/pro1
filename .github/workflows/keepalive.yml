# Mantiene despierto el servidor de Render (el plan gratuito se duerme tras ~15 min sin visitas).
# GitHub ejecuta este flujo cada 14 minutos y llama a /healthz.
# Requisito: en el repositorio, Settings → Secrets and variables → Actions → pestaña Variables,
# crea la variable APP_URL con la dirección de tu servicio, por ejemplo https://tu-servicio.onrender.com
name: Mantener Render activo

on:
  schedule:
    - cron: '*/14 * * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Llamar a /healthz
        env:
          APP_URL: ${{ vars.APP_URL }}
        run: |
          if [ -z "$APP_URL" ]; then echo "Falta la variable APP_URL (Settings > Secrets and variables > Actions > Variables)"; exit 1; fi
          curl -fsS --retry 4 --retry-delay 20 --retry-all-errors --max-time 90 "${APP_URL%/}/healthz"
          echo
